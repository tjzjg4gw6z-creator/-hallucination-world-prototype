<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>幻覚世界 第9試作 - 教室</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070c;color:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none;overscroll-behavior:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#title,#result{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#302034,#08070c 70%)}
.card{width:min(92vw,520px);padding:24px;border:1px solid #815c82;border-radius:22px;background:#17121ceF;box-shadow:0 20px 70px #000b}
h1{font-size:25px;margin:0 0 10px}.sub{color:#d7cbd8;line-height:1.7;font-size:14px}
.main{width:100%;border:0;border-radius:15px;padding:15px;background:#e6a7d0;color:#20131e;font-size:18px;font-weight:800}
#hud{position:fixed;z-index:25;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;gap:7px;pointer-events:none}
.h{flex:1;background:#08060bbb;border:1px solid #ffffff20;border-radius:12px;padding:7px;text-align:center;font-size:12px}
.bar{height:5px;margin-top:4px;background:#322b35;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#e7b7ed}#hpfill{background:#ed779a}
#chapter{position:fixed;z-index:26;top:72px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;background:#0a0710b5;border:1px solid #ffffff18;padding:7px 12px;border-radius:99px;pointer-events:none}
#msg{position:fixed;z-index:40;left:50%;top:18%;transform:translateX(-50%);padding:9px 14px;border-radius:12px;background:#000c;opacity:0;transition:.15s;pointer-events:none}.show{opacity:1!important}
#controls{position:fixed;z-index:35;inset:0;pointer-events:none}
#joy{position:absolute;left:18px;bottom:max(24px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;border:2px solid #ffffff24;background:#ffffff0b;pointer-events:auto}
#knob{position:absolute;left:48px;top:48px;width:54px;height:54px;border-radius:50%;background:#d8b3e475;border:1px solid #fff5}
#actions{position:absolute;right:17px;bottom:max(23px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:11px;pointer-events:auto}
.act{border-radius:50%;color:#fff;font-weight:800}#attack{width:98px;height:98px;border:2px solid #f3b3d4;background:#c95796df}#dodge{width:72px;height:72px;border:2px solid #c2c2f3;background:#6669a6df}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div class="h">HP <span id="hp">100</span><div class="bar"><div id="hpfill" class="fill"></div></div></div><div class="h">現実感 <span id="san">100</span>%<div class="bar"><div id="sanfill" class="fill"></div></div></div></div>
<div id="chapter" class="hidden">第1章　放課後の教室</div><div id="msg"></div>
<div id="controls" class="hidden"><div id="joy"><div id="knob"></div></div><div id="actions"><button id="dodge" class="act">回避</button><button id="attack" class="act">攻撃</button></div></div>
<section id="title"><div class="card"><h1>幻覚世界 — 第9試作</h1><div class="sub">製品版を想定した最初の<strong>ビジュアル・ステージ試作</strong>。<br>放課後の教室が幻覚によって歪み、主人公を責める「視線」と「言葉」が敵として現れます。<br><br>主人公・敵・背景を仮のゲームモデルへ変更しています。</div><br><button id="start" class="main">教室へ入る</button></div></section>
<section id="result" class="hidden"><div class="card"><h1>静かになった。</h1><div class="sub">黒板の文字が消え、教室に夕方の光が戻ってくる。<br><br>「……まだ、帰れる。」</div><br><button id="retry" class="main">もう一度</button></div></section>
<script>
(()=>{
const $=s=>document.querySelector(s),c=$('#game'),x=c.getContext('2d');let W,H,D,last=0,run=false;
let p,enemies=[],parts=[],jx=0,jy=0,jp=0,jid=null,shake=0,flash=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=(a,b)=>{let m=Math.hypot(a,b)||1;return{x:a/m,y:b/m}},dot=(a,b,c,d)=>a*c+b*d;
function resize(){W=innerWidth;H=innerHeight;D=Math.max(1,devicePixelRatio||1);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const TW=72,TH=36;let cam={x:0,y:0};function iso(a,b,z=0){return{x:(a-b)*TW/2-cam.x+W/2,y:(a+b)*TH/2-z-cam.y+H*.42}}
function mk(a,b,type){return{x:a,y:b,type,hp:type==='whisper'?2:3,state:'idle',cool:.5+Math.random(),timer:0,ang:0,alive:true,white:0}}
function reset(){p={x:0,y:3.7,hp:100,san:100,face:{x:0,y:-1},atk:0,dodge:0,inv:0,dodgeCd:0,dashX:0,dashY:0};enemies=[mk(-3,-1,'eye'),mk(3,-2,'eye'),mk(0,-4,'whisper'),mk(4,2,'whisper')];parts=[];last=0}
function hud(){$('#hp').textContent=Math.round(p.hp);$('#san').textContent=Math.round(p.san);$('#hpfill').style.width=p.hp+'%';$('#sanfill').style.width=p.san+'%';$('#dodge').style.opacity=p.dodgeCd>0?.42:1}
function msg(t){let m=$('#msg');m.textContent=t;m.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>m.classList.remove('show'),650)}
function tone(f,d,v=.025){try{let A=window.AudioContext||window.webkitAudioContext;tone.a=tone.a||new A();let o=tone.a.createOscillator(),g=tone.a.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(tone.a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,tone.a.currentTime+d);o.stop(tone.a.currentTime+d)}catch(e){}}
function start(){reset();$('#title').classList.add('hidden');$('#result').classList.add('hidden');$('#hud').classList.remove('hidden');$('#chapter').classList.remove('hidden');$('#controls').classList.remove('hidden');run=true;msg('「みんな、見てる。」');requestAnimationFrame(loop)}$('#start').onclick=start;$('#retry').onclick=start;
const joy=$('#joy'),knob=$('#knob');function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),lim=48;jp=Math.min(1,m/lim);if(m>lim){dx*=lim/m;dy*=lim/m}jx=dx/lim;jy=dy/lim;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);setJoy(e)};joy.onpointermove=e=>{if(e.pointerId===jid)setJoy(e)};function je(e){if(e.pointerId===jid){jid=null;jx=jy=jp=0;knob.style.transform=''}}joy.onpointerup=je;joy.onpointercancel=je;
function attack(){if(!run||p.atk>0)return;p.atk=.2;tone(330,.05);let hit=false;enemies.forEach(e=>{if(!e.alive)return;let vx=e.x-p.x,vy=e.y-p.y,d=Math.hypot(vx,vy),n=norm(vx,vy);if(d<2.3&&dot(n.x,n.y,p.face.x,p.face.y)>.28){e.hp--;e.white=.12;e.x+=n.x*.35;e.y+=n.y*.35;hit=true;shake=.08;tone(145,.06,.035);try{navigator.vibrate&&navigator.vibrate(16)}catch(_){};if(e.hp<=0)e.alive=false}});if(!hit)msg('MISS')}$('#attack').onpointerdown=e=>{e.preventDefault();attack()};
function dodge(){if(!run||p.dodge>0||p.dodgeCd>0)return;let dx=jx,dy=jy;if(Math.hypot(dx,dy)<.12){dx=p.face.x;dy=p.face.y}let n=norm(dx,dy);p.dashX=n.x;p.dashY=n.y;p.face=n;p.dodge=.22;p.inv=.28;p.dodgeCd=.85;tone(230,.06)}$('#dodge').onpointerdown=e=>{e.preventDefault();dodge()};
function update(dt){let m=Math.hypot(jx,jy);if(p.dodge>0){p.x+=p.dashX*8.2*dt;p.y+=p.dashY*8.2*dt}else if(m>.03){let n=norm(jx,jy),sp=2.6+3.4*jp;p.x+=n.x*sp*dt;p.y+=n.y*sp*dt;p.face=n}p.x=clamp(p.x,-6.4,6.4);p.y=clamp(p.y,-5.2,5.2);if(p.atk>0)p.atk-=dt;if(p.dodge>0)p.dodge-=dt;if(p.inv>0)p.inv-=dt;if(p.dodgeCd>0)p.dodgeCd-=dt;if(shake>0)shake-=dt;
enemies.forEach(e=>{if(!e.alive)return;if(e.white>0)e.white-=dt;let vx=p.x-e.x,vy=p.y-e.y,d=Math.hypot(vx,vy);if(e.state==='idle'){if(d<6&&d>1.6){let n=norm(vx,vy),sp=e.type==='whisper'?.62:.75;e.x+=n.x*sp*dt;e.y+=n.y*sp*dt}e.cool-=dt;if(d<2.1&&e.cool<=0){e.state='warn';e.timer=.7;e.ang=Math.atan2(vy,vx)}}else{e.timer-=dt;if(e.timer<=0){let dir={x:Math.cos(e.ang),y:Math.sin(e.ang)},pv={x:p.x-e.x,y:p.y-e.y},pd=Math.hypot(pv.x,pv.y),pn=norm(pv.x,pv.y);if(pd<2.3&&dot(pn.x,pn.y,dir.x,dir.y)>.55&&p.inv<=0){p.hp-=12;p.san-=e.type==='whisper'?9:5;shake=.18;tone(90,.12,.04);msg(e.type==='whisper'?'「消えればいいのに」':'視線が刺さる')}e.state='idle';e.cool=1.45}}});hud();if(enemies.every(e=>!e.alive)){run=false;setTimeout(()=>{$('#result').classList.remove('hidden');$('#controls').classList.add('hidden')},450)}}
function poly(ps,fill,stroke){x.beginPath();x.moveTo(ps[0].x,ps[0].y);ps.slice(1).forEach(q=>x.lineTo(q.x,q.y));x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}}
function floor(){x.fillStyle='#15131a';x.fillRect(0,0,W,H); // back wall/window mood
let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#312235');g.addColorStop(.55,'#18131d');g.addColorStop(1,'#5a3542');x.fillStyle=g;x.fillRect(0,0,W,H*.30);
x.fillStyle='#d68c9b22';for(let i=0;i<4;i++)x.fillRect(W*.05+i*W*.24,H*.06,W*.18,H*.17);
for(let a=-8;a<=8;a++){let A=iso(a,-6),B=iso(a,7);x.strokeStyle='#6d607126';x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()}for(let b=-6;b<=7;b++){let A=iso(-8,b),B=iso(8,b);x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()}
 // blackboard
x.fillStyle='#17211f';x.fillRect(W*.22,H*.13,W*.56,H*.12);x.strokeStyle='#7c6e70';x.strokeRect(W*.22,H*.13,W*.56,H*.12);x.fillStyle='#d7c7cf55';x.font='13px sans-serif';x.fillText('普通になれ　　笑って　　空気を読め',W*.27,H*.19);
}
function desk(a,b){let q=iso(a,b),s=1;x.fillStyle='#251c22';x.fillRect(q.x-24,q.y-13,48,22);x.fillStyle='#684a43';x.fillRect(q.x-25,q.y-17,50,8);x.strokeStyle='#463a40';x.beginPath();x.moveTo(q.x-19,q.y+9);x.lineTo(q.x-22,q.y+30);x.moveTo(q.x+19,q.y+9);x.lineTo(q.x+22,q.y+30);x.stroke()}
function player(){let q=iso(p.x,p.y),a=Math.atan2(p.face.y,p.face.x);x.save();x.translate(q.x,q.y);if(p.dodge>0){x.globalAlpha=.2;x.fillStyle='#d79bc8';x.beginPath();x.ellipse(-p.dashX*24,-p.dashY*12,15,29,0,0,7);x.fill();x.globalAlpha=1}
x.fillStyle='#0007';x.beginPath();x.ellipse(0,31,18,7,0,0,7);x.fill();
// legs + platform boots
x.strokeStyle='#17131b';x.lineWidth=8;x.beginPath();x.moveTo(-7,18);x.lineTo(-8,34);x.moveTo(7,18);x.lineTo(9,34);x.stroke();x.fillStyle='#08070a';x.fillRect(-15,31,13,7);x.fillRect(3,31,14,7);
// skirt/body
x.fillStyle='#18131d';poly([{x:-20,y:17},{x:20,y:17},{x:15,y:-6},{x:-15,y:-6}],'#1c1620');x.strokeStyle='#8e5279';x.lineWidth=2;x.beginPath();x.moveTo(-18,13);x.lineTo(18,13);x.stroke();
x.fillStyle='#2b202e';x.fillRect(-15,-22,30,20);x.strokeStyle='#a35d8a';x.strokeRect(-15,-22,30,20);
// head + twin tails
x.fillStyle='#e7cdd4';x.beginPath();x.arc(0,-36,13,0,7);x.fill();x.fillStyle='#17121c';x.beginPath();x.arc(0,-40,14,Math.PI,Math.PI*2);x.fill();x.beginPath();x.ellipse(-17,-35,8,18,-.25,0,7);x.ellipse(17,-35,8,18,.25,0,7);x.fill();
x.fillStyle='#9a5a86';x.beginPath();x.arc(-14,-48,4,0,7);x.arc(14,-48,4,0,7);x.fill();
// arm/weapon: chained bear charm represented as dark flail silhouette
x.save();x.rotate(a*.18);x.strokeStyle='#d5b0c6';x.lineWidth=5;x.beginPath();x.moveTo(11,-12);x.lineTo(26,-5);x.stroke();x.strokeStyle='#8a7586';x.lineWidth=2;x.beginPath();x.moveTo(26,-5);x.lineTo(38,4);x.stroke();x.fillStyle='#17131a';x.beginPath();x.arc(41,7,7,0,7);x.fill();x.restore();
if(p.atk>0){x.strokeStyle='#efb4d5';x.lineWidth=4;x.beginPath();x.arc(0,0,45,a-.65,a+.65);x.stroke()}x.restore()}
function enemy(e){let q=iso(e.x,e.y);x.save();x.translate(q.x,q.y);if(e.white>0)x.globalAlpha=.5;
if(e.type==='eye'){ // "classmates' gaze" - floating schoolgirl silhouette with giant eye
x.fillStyle='#100d13';x.beginPath();x.moveTo(-17,28);x.lineTo(17,28);x.lineTo(12,-5);x.lineTo(-12,-5);x.fill();x.fillStyle='#d8c8d0';x.beginPath();x.ellipse(0,-20,18,13,0,0,7);x.fill();x.fillStyle='#1a111a';x.beginPath();x.ellipse(0,-20,9,12,0,0,7);x.fill();x.fillStyle='#d86b9c';x.beginPath();x.arc(0,-20,3,0,7);x.fill()}
else{ // whisper mass made of scribbled speech strips
x.fillStyle='#161018';x.beginPath();x.arc(0,0,25,0,7);x.fill();x.strokeStyle='#bd789e';x.lineWidth=2;for(let i=0;i<5;i++){x.beginPath();x.moveTo(-20,-12+i*7);x.lineTo(20,-8+i*6);x.stroke()}x.fillStyle='#e3c5d5';x.font='10px sans-serif';x.fillText('ムリ',-12,3)}
if(e.state==='warn'){x.strokeStyle='#ef7188';x.lineWidth=3;x.beginPath();x.arc(0,0,34+Math.sin(performance.now()/60)*3,0,7);x.stroke()}x.restore()}
function draw(){x.save();if(shake>0)x.translate((Math.random()-.5)*7,(Math.random()-.5)*7);floor();[[-4,-3],[0,-3],[4,-3],[-4,0],[0,0],[4,0],[-4,3],[4,3]].forEach(d=>desk(...d));let objs=[...enemies.filter(e=>e.alive).map(e=>({y:e.x+e.y,f:()=>enemy(e)})),{y:p.x+p.y,f:player}].sort((a,b)=>a.y-b.y);objs.forEach(o=>o.f());x.restore()}
function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
})();
</script>
</body></html>
